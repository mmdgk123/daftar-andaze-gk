<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0090d0">
<title>دفتر اندازه کناف</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: #f4f6f5; color: #14201b;
    min-height: 100dvh;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, textarea, select { font-family: inherit; }

  /* ---------- هدر ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: #0090d0; color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) 16px 12px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 2px 10px rgba(4,120,87,.25);
  }
  header .back { font-size: 22px; color: #fff; padding: 2px 6px; display: none; }
  header h1 { font-size: 18px; font-weight: 800; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .pill { font-size: 11px; opacity: .85; font-weight: 500; }
  header .upd {
    background: rgba(255,255,255,.16); color: #fff; font-size: 12.5px; font-weight: 700;
    padding: 7px 12px; border-radius: 999px; flex: none;
  }
  header .upd:disabled { opacity: .6; }

  main { padding: 14px 14px 110px; max-width: 640px; margin: 0 auto; }

  /* ---------- فهرست برگه‌ها ---------- */
  .empty {
    text-align: center; color: #5b6b64; padding: 56px 20px; line-height: 2;
    font-size: 15px;
  }
  .empty .big { font-size: 44px; display: block; margin-bottom: 6px; }
  .card {
    background: #fff; border: 1px solid #e2e8e5; border-radius: 16px;
    padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 1px 3px rgba(16,40,30,.05); text-align: right; width: 100%;
  }
  .card .ic {
    width: 44px; height: 44px; border-radius: 12px; flex: none;
    background: #eaf6fc; display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .card .t { flex: 1; min-width: 0; }
  .card .t b { display: block; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .t span { font-size: 12px; color: #6b7a73; }
  .card .del { color: #dc2626; font-size: 19px; padding: 8px; flex: none; }

  .list-head { margin-bottom: 12px; }
  .del-all {
    width: 100%; padding: 11px; border-radius: 12px; font-size: 14px; font-weight: 700;
    background: #fef2f2; color: #dc2626; border: 1.5px solid #fecaca;
  }

  .fab {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); inset-inline-start: 50%;
    transform: translateX(50%);
    background: #0090d0; color: #fff; font-size: 16px; font-weight: 700;
    padding: 14px 26px; border-radius: 999px; box-shadow: 0 8px 22px rgba(4,120,87,.4);
    z-index: 30;
  }
  [dir="rtl"] .fab { transform: translateX(50%); }

  /* ---------- ویرایشگر ---------- */
  #editorView { display: none; }
  .meta-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .meta-row input[type="text"] {
    flex: 1; min-width: 0; border: 1.5px solid #d7e0db; border-radius: 12px;
    padding: 10px 12px; font-size: 15px; background: #fff; outline: none;
  }
  .meta-row input[type="text"]:focus { border-color: #0090d0; }
  .chips { display: flex; gap: 6px; margin-bottom: 10px; }
  .chip {
    padding: 7px 14px; border-radius: 999px; border: 1.5px solid #d7e0db;
    background: #fff; font-size: 13.5px; font-weight: 500; color: #43554d;
  }
  .chip.on { background: #0090d0; border-color: #0090d0; color: #fff; }

  .canvas-wrap {
    position: relative; border-radius: 16px; overflow: hidden;
    border: 1.5px solid #cfdcd5; background: #fff;
    height: min(58dvh, 520px); touch-action: none;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .lbl {
    position: absolute; transform: translate(-50%, -50%);
    background: #0070aa; color: #fff; font-size: 13px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    box-shadow: 0 2px 6px rgba(6,60,44,.35); user-select: none; -webkit-user-select: none;
    touch-action: none; z-index: 5;
  }
  .hint {
    position: absolute; bottom: 8px; inset-inline: 0; text-align: center;
    font-size: 12px; color: #7a8a82; pointer-events: none; z-index: 4;
  }

  .toolbar {
    display: flex; gap: 6px; margin-top: 10px; background: #fff;
    border: 1px solid #e2e8e5; border-radius: 14px; padding: 8px;
  }
  .tool {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 2px; border-radius: 10px; font-size: 11.5px; font-weight: 500; color: #43554d;
  }
  .tool .ti { font-size: 19px; line-height: 1; }
  .tool.on { background: #eaf6fc; color: #0090d0; }
  .tool.danger { color: #dc2626; }

  .opts { display: flex; gap: 14px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .opts .grp { display: flex; gap: 6px; align-items: center; }
  .sw {
    width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid #fff;
    box-shadow: 0 0 0 1.5px #c8d4cd; padding: 0;
  }
  .sw.on { box-shadow: 0 0 0 2.5px #0090d0; }
  .wd {
    border: 1.5px solid #d7e0db; background: #fff; border-radius: 8px;
    padding: 5px 10px; font-size: 12px; font-weight: 700; color: #43554d;
  }
  .wd.on { border-color: #0090d0; color: #0090d0; background: #eaf6fc; }

  textarea.note {
    width: 100%; margin-top: 10px; border: 1.5px solid #d7e0db; border-radius: 12px;
    padding: 10px 12px; font-size: 14px; min-height: 58px; resize: vertical; outline: none; background: #fff;
  }
  textarea.note:focus { border-color: #0090d0; }
  .saved { text-align: center; font-size: 12px; color: #6b7a73; margin-top: 8px; min-height: 16px; }

  /* ---------- شیت پایین ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(10,25,20,.45); z-index: 40;
    display: none; align-items: flex-end; justify-content: center;
  }
  .scrim.open { display: flex; }
  .sheet {
    background: #fff; width: 100%; max-width: 640px; border-radius: 20px 20px 0 0;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    animation: up .22s ease;
  }
  @keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
  .sheet h3 { margin: 0 0 12px; font-size: 16px; }
  .sheet input[type="text"], .sheet input[type="number"] {
    width: 100%; border: 1.5px solid #d7e0db; border-radius: 12px;
    padding: 12px; font-size: 17px; outline: none; margin-bottom: 10px;
  }
  .sheet input:focus { border-color: #0090d0; }
  .sheet .row { display: flex; gap: 8px; }
  .btn {
    flex: 1; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 700;
    background: #eef2f0; color: #33463d;
  }
  .btn.pri { background: #0090d0; color: #fff; }
  .btn.del { background: #fef2f2; color: #dc2626; }
</style>
</head>
<body>

<header>
  <button class="back" id="backBtn" aria-label="برگشت">›</button>
  <h1 id="hdrTitle">دفتر اندازه کناف</h1>
  <button class="upd" id="updBtn">⟳ بروزرسانی</button>
  <span class="pill">mmdGK</span>
</header>

<main>
  <!-- فهرست -->
  <section id="listView">
    <div id="listBox"></div>
  </section>

  <!-- ویرایشگر -->
  <section id="editorView">
    <div class="canvas-wrap" id="wrap">
      <canvas id="cv"></canvas>
      <div class="hint" id="hint">با انگشت شکل رو بکش</div>
    </div>

    <div class="toolbar">
      <button class="tool on" data-tool="pen"><span class="ti">✏️</span>قلم</button>
      <button class="tool" data-tool="num"><span class="ti">🔢</span>عدد</button>
      <button class="tool" data-tool="erase"><span class="ti">🧽</span>پاک‌کن</button>
      <button class="tool" id="undoBtn"><span class="ti">↩️</span>واگرد</button>
      <button class="tool" id="flipBtn"><span class="ti">⇋</span>برگردوندن</button>
      <button class="tool" id="tidyBtn"><span class="ti">📐</span>مرتب‌سازی</button>
      <button class="tool danger" id="clearBtn"><span class="ti">🗑️</span>پاک‌کردن</button>
    </div>

    <div class="opts">
      <div class="grp" id="colors">
        <button class="sw on" data-c="#0070aa" style="background:#0070aa" aria-label="سبز"></button>
        <button class="sw" data-c="#dc2626" style="background:#dc2626" aria-label="قرمز"></button>
        <button class="sw" data-c="#2563eb" style="background:#2563eb" aria-label="آبی"></button>
        <button class="sw" data-c="#111827" style="background:#111827" aria-label="مشکی"></button>
      </div>
      <div class="grp" id="widths">
        <button class="wd" data-w="2">نازک</button>
        <button class="wd on" data-w="3.5">معمولی</button>
        <button class="wd" data-w="6">ضخیم</button>
      </div>
    </div>

    <div class="saved" id="savedLbl"></div>
    <div class="saved" id="scaleLbl" style="color:#0070aa;font-weight:700"></div>
  </section>
</main>

<button class="fab" id="newBtn">＋ برگه تازه</button>

<!-- شیت: عدد -->
<div class="scrim" id="numScrim">
  <div class="sheet">
    <h3 id="numTitle">اندازه به سانتیمتر</h3>
    <input type="text" id="numInp" inputmode="decimal" enterkeyhint="done" placeholder="مثلاً ۱۱۹٫۵" autocomplete="off">
    <div class="row">
      <button class="btn pri" id="numOk">ثبت</button>
      <button class="btn del" id="numDel" style="display:none">حذف عدد</button>
      <button class="btn" id="numCancel">لغو</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ===== ابزار عدد فارسی ===== */
const FA = '۰۱۲۳۴۵۶۷۸۹';
const toFa = s => String(s).replace(/[0-9]/g, d => FA[d]).replace(/\./g, '٫');
const fmt = (n, dec = 2) => {
  const f = Math.pow(10, dec);
  let v = Math.round(n * f) / f;
  let s = (dec === 0) ? String(Math.round(v)) : String(v);
  return toFa(s);
};
/* تبدیل ورودی کاربر (ارقام فارسی/عربی و اعشار فارسی) به عدد */
function parseNum(raw) {
  if (raw == null) return NaN;
  let s = String(raw).trim()
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[٫٬,]/g, '.')
    .replace(/[^0-9.]/g, '');
  const parts = s.split('.');
  if (parts.length > 2) s = parts[0] + '.' + parts.slice(1).join('');
  return parseFloat(s);
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ===== ذخیره‌سازی ===== */
const KEY = 'kanaf-notebook-v1';
let sheets = [];
try { sheets = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { sheets = []; }
function persist() { localStorage.setItem(KEY, JSON.stringify(sheets)); }

/* ===== وضعیت ===== */
let cur = null;            // برگه فعلی
let tool = 'pen';
let color = '#0070aa', widthPt = 3.5;
let history = [];

/* ===== المان‌ها ===== */
const $ = id => document.getElementById(id);
const listView = $('listView'), editorView = $('editorView'), listBox = $('listBox');
const wrap = $('wrap'), cv = $('cv'), ctx = cv.getContext('2d');
const hint = $('hint');

/* ===== فهرست ===== */
function renderList() {
  listView.style.display = 'block'; editorView.style.display = 'none';
  $('newBtn').style.display = 'block'; $('backBtn').style.display = 'none';
  $('hdrTitle').textContent = 'دفتر اندازه کناف';
  if (!sheets.length) {
    listBox.innerHTML = '<div class="empty"><span class="big">📐</span>هنوز برگه‌ای نداری.<br>با دکمه «برگه تازه» برای هر کار یه برگه باز کن،<br>شکل رو بکش و اندازه‌ها رو روش بنویس.</div>';
    return;
  }
  listBox.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'list-head';
  const delAll = document.createElement('button');
  delAll.className = 'del-all'; delAll.textContent = '🗑 حذف همه برگه‌ها';
  delAll.onclick = () => {
    if (confirm('همه برگه‌ها پاک بشن؟ این کار برگشت نداره.')) { sheets = []; persist(); renderList(); }
  };
  head.appendChild(delAll);
  listBox.appendChild(head);
  [...sheets].sort((a, b) => b.updatedAt - a.updatedAt).forEach(sh => {
    const dc = new Date(sh.createdAt), du = new Date(sh.updatedAt);
    const nameStr = toFa(dc.toLocaleDateString('fa-IR')) + ' · ساعت ' + toFa(dc.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' }));
    const dateStr = toFa(du.toLocaleDateString('fa-IR'));
    const card = document.createElement('button');
    card.className = 'card';
    card.innerHTML = '<div class="ic">📐</div>' +
      '<div class="t"><b></b><span>آخرین ویرایش: ' + dateStr + '</span></div>';
    card.querySelector('b').textContent = nameStr;
    const del = document.createElement('span');
    del.className = 'del'; del.textContent = '🗑';
    del.onclick = e => {
      e.stopPropagation();
      if (confirm('این برگه پاک بشه؟')) { sheets = sheets.filter(s => s.id !== sh.id); persist(); renderList(); }
    };
    card.appendChild(del);
    card.onclick = () => openSheet(sh.id);
    listBox.appendChild(card);
  });
}

/* ===== ساخت و باز کردن برگه ===== */
$('newBtn').onclick = () => {
  const sh = { id: uid(), note: '', strokes: [], labels: [], createdAt: Date.now(), updatedAt: Date.now() };
  sheets.push(sh); persist(); openSheet(sh.id);
};

function openSheet(id) {
  cur = sheets.find(s => s.id === id); if (!cur) return;
  history = [];
  listView.style.display = 'none'; editorView.style.display = 'block';
  $('newBtn').style.display = 'none'; $('backBtn').style.display = 'block';
  $('hdrTitle').textContent = 'برگه اندازه';
  setTool('pen');
  requestAnimationFrame(() => { resizeCanvas(); render(); });
}
$('backBtn').onclick = () => { saveCur(); renderList(); };

let savedTimer = null;
function saveCur(showTick = true) {
  if (!cur) return;
  cur.updatedAt = Date.now(); persist();
  if (showTick) {
    $('savedLbl').textContent = 'ذخیره شد ✓';
    clearTimeout(savedTimer);
    savedTimer = setTimeout(() => $('savedLbl').textContent = '', 1400);
  }
}

/* ===== بوم ===== */
function resizeCanvas() {
  const r = wrap.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  render();
}
window.addEventListener('resize', resizeCanvas);

function drawGrid(w, h) {
  const dpr = window.devicePixelRatio || 1;
  if (cur && cur.cmPerUnit) {
    /* شبکه واقعی: هر خونه ۵ سانت، خط پررنگ هر ۲۵ سانت */
    const cell = 5 * w / cur.cmPerUnit;
    if (cell > 3) {
      for (let pass = 0; pass < 2; pass++) {
        ctx.strokeStyle = pass ? '#c3d9e2' : '#e7eff2'; ctx.lineWidth = 1;
        ctx.beginPath();
        let i = 0;
        for (let x = cell; x < w; x += cell, i++) {
          if ((i % 5 === 4) !== !!pass) continue;
          ctx.moveTo(x, 0); ctx.lineTo(x, h);
        }
        i = 0;
        for (let y = cell; y < h; y += cell, i++) {
          if ((i % 5 === 4) !== !!pass) continue;
          ctx.moveTo(0, y); ctx.lineTo(w, y);
        }
        ctx.stroke();
      }
      return;
    }
  }
  const step = 24 * dpr;
  ctx.strokeStyle = '#e3ece7'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = step; x < w; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
  for (let y = step; y < h; y += step) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
  ctx.stroke();
}

function render() {
  if (!cur) return;
  const w = cv.width, h = cv.height;
  ctx.clearRect(0, 0, w, h);
  drawGrid(w, h);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  cur.strokes.forEach(st => {
    ctx.strokeStyle = st.color; ctx.lineWidth = st.width * (window.devicePixelRatio || 1);
    ctx.beginPath();
    st.points.forEach((p, i) => {
      const x = p[0] * w, y = p[1] * h;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    if (st.points.length === 1) ctx.lineTo(st.points[0][0] * w + 0.1, st.points[0][1] * h + 0.1);
    ctx.stroke();
  });
  renderLabels();
  $('scaleLbl').textContent = cur.cmPerUnit ? '📏 مقیاس فعاله — هر خونه‌ی شبکه = ۵ سانت' : '';
  hint.style.display = (cur.strokes.length || cur.labels.length) ? 'none' :
    'block';
  hint.textContent = tool === 'num' ? 'روی شکل، کنار لبه‌ای که اندازه‌اش رو می‌خوای بنویسی، بزن' : 'با انگشت شکل رو بکش';
}

function renderLabels() {
  wrap.querySelectorAll('.lbl').forEach(e => e.remove());
  cur.labels.forEach(l => {
    const el = document.createElement('div');
    el.className = 'lbl'; el.textContent = fmt(+l.value || 0, 1);
    el.style.left = (l.x * 100) + '%'; el.style.top = (l.y * 100) + '%';
    el.dataset.id = l.id;
    wrap.appendChild(el);
  });
}

/* ===== ابزارها ===== */
function setTool(t) {
  tool = t;
  document.querySelectorAll('.tool[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  render();
}
document.querySelectorAll('.tool[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
document.querySelectorAll('#colors .sw').forEach(b => b.onclick = () => {
  color = b.dataset.c;
  document.querySelectorAll('#colors .sw').forEach(x => x.classList.toggle('on', x === b));
  setTool('pen');
});
document.querySelectorAll('#widths .wd').forEach(b => b.onclick = () => {
  widthPt = +b.dataset.w;
  document.querySelectorAll('#widths .wd').forEach(x => x.classList.toggle('on', x === b));
});

function pushHistory() {
  history.push(JSON.stringify({ strokes: cur.strokes, labels: cur.labels }));
  if (history.length > 40) history.shift();
}
$('undoBtn').onclick = () => {
  const last = history.pop(); if (!last) return;
  const s = JSON.parse(last); cur.strokes = s.strokes; cur.labels = s.labels;
  render(); saveCur();
};
$('clearBtn').onclick = () => {
  if (!cur.strokes.length && !cur.labels.length) return;
  if (!confirm('همه خط‌ها و عددهای این برگه پاک بشن؟')) return;
  pushHistory(); cur.strokes = []; cur.labels = []; cur.cmPerUnit = null; render(); saveCur();
};
/* برگردوندن آینه‌ای نقشه (چپ و راست عوض می‌شن) — برای وقتی نقشه از پشت صفحه کشیده شده
   و صفحه برای برش رو به روست؛ با هر زدن دوباره برمی‌گرده. */
let flipTimer = null;
$('flipBtn').onclick = () => {
  if (!cur.strokes.length && !cur.labels.length) return;
  pushHistory();
  cur.strokes.forEach(st => st.points.forEach(p => { p[0] = 1 - p[0]; }));
  cur.labels.forEach(l => { l.x = 1 - l.x; });
  render(); saveCur(false);
  $('savedLbl').textContent = 'نقشه برگردونده شد ⇋';
  clearTimeout(flipTimer);
  flipTimer = setTimeout(() => $('savedLbl').textContent = '', 1600);
};

/* ===== مرتب‌سازی شکل =====
   لبه‌های کجِ دست‌کشیده صاف و گوشه‌ها گونیا می‌شن؛ اگه روی ضلع‌ها اندازه
   خورده باشه، شکل با همون اندازه‌ها تنظیم و مقیاس واقعی (هر خونه = ۵ سانت) فعال می‌شه. */
let tidyTimer = null;
function flashMsg(msg) {
  $('savedLbl').textContent = msg;
  clearTimeout(tidyTimer);
  tidyTimer = setTimeout(() => $('savedLbl').textContent = '', 2400);
}
function dpSimplify(pts, eps) {
  if (pts.length < 3) return pts.slice();
  const keep = new Array(pts.length).fill(false);
  keep[0] = keep[pts.length - 1] = true;
  const stack = [[0, pts.length - 1]];
  while (stack.length) {
    const ab = stack.pop(), a = ab[0], b = ab[1];
    const A = pts[a], B = pts[b];
    const dx = B[0] - A[0], dy = B[1] - A[1];
    const L = Math.hypot(dx, dy) || 1e-9;
    let dmax = 0, idx = -1;
    for (let i = a + 1; i < b; i++) {
      const d = Math.abs((pts[i][0] - A[0]) * dy - (pts[i][1] - A[1]) * dx) / L;
      if (d > dmax) { dmax = d; idx = i; }
    }
    if (dmax > eps && idx > 0) { keep[idx] = true; stack.push([a, idx], [idx, b]); }
  }
  return pts.filter((_, i) => keep[i]);
}
function ringSimplify(R, eps) {
  /* ساده‌سازی حلقه بسته: از دورترین نقطه نسبت به شروع شکسته می‌شه تا الگوریتم خراب نشه */
  let f = 0, fd = -1;
  for (let i = 1; i < R.length; i++) {
    const d = Math.hypot(R[i][0] - R[0][0], R[i][1] - R[0][1]);
    if (d > fd) { fd = d; f = i; }
  }
  const Q = R.slice(f).concat(R.slice(0, f));
  Q.push(Q[0].slice());
  const keep = new Array(Q.length).fill(false);
  keep[0] = keep[Q.length - 1] = true;
  let m = 0, md = -1;
  for (let i = 1; i < Q.length - 1; i++) {
    const d = Math.hypot(Q[i][0] - Q[0][0], Q[i][1] - Q[0][1]);
    if (d > md) { md = d; m = i; }
  }
  keep[m] = true;
  const stack = [[0, m], [m, Q.length - 1]];
  while (stack.length) {
    const ab = stack.pop(), a = ab[0], b = ab[1];
    const A = Q[a], B = Q[b];
    const dx = B[0] - A[0], dy = B[1] - A[1];
    const L = Math.hypot(dx, dy) || 1e-9;
    let dmax = 0, idx = -1;
    for (let i = a + 1; i < b; i++) {
      const d = Math.abs((Q[i][0] - A[0]) * dy - (Q[i][1] - A[1]) * dx) / L;
      if (d > dmax) { dmax = d; idx = i; }
    }
    if (dmax > eps && idx > 0) { keep[idx] = true; stack.push([a, idx], [idx, b]); }
  }
  const out = Q.filter((_, i) => keep[i]);
  out.pop();
  return out;
}
function dropStraight(V, closed) {
  /* رأس‌های تقریباً روی خط راست (لرزش دست روی ضلع صاف) حذف می‌شن؛
     گوشه‌های واقعی مثل پله سالم می‌مونن */
  let changed = true, guard = 0;
  while (changed && guard++ < 12 && V.length > (closed ? 3 : 2)) {
    changed = false;
    for (let i = 0; i < V.length; i++) {
      if (!closed && (i === 0 || i === V.length - 1)) continue;
      const a = V[(i - 1 + V.length) % V.length], b = V[i], c = V[(i + 1) % V.length];
      const v1 = [b[0] - a[0], b[1] - a[1]], v2 = [c[0] - b[0], c[1] - b[1]];
      const l1 = Math.hypot(v1[0], v1[1]), l2 = Math.hypot(v2[0], v2[1]);
      if (l1 < 1e-6 || l2 < 1e-6) { V.splice(i, 1); changed = true; break; }
      const cos = (v1[0] * v2[0] + v1[1] * v2[1]) / (l1 * l2);
      if (cos > 0.94) { V.splice(i, 1); changed = true; break; }
    }
  }
  return V;
}
function orthoSnap(V, closed, strength) {
  const n = V.length, m = closed ? n : n - 1;
  for (let it = 0; it < 30; it++) {
    for (let e = 0; e < m; e++) {
      const a = V[e], b = V[(e + 1) % n];
      const dx = b[0] - a[0], dy = b[1] - a[1];
      if (Math.hypot(dx, dy) < 1e-6) continue;
      const ang = Math.abs(Math.atan2(dy, dx));
      const fromH = Math.min(ang, Math.PI - ang);
      const fromV = Math.abs(Math.PI / 2 - ang);
      if (fromH < 0.38) { const ym = (a[1] + b[1]) / 2; a[1] += (ym - a[1]) * strength; b[1] += (ym - b[1]) * strength; }
      else if (fromV < 0.38) { const xm = (a[0] + b[0]) / 2; a[0] += (xm - a[0]) * strength; b[0] += (xm - b[0]) * strength; }
    }
  }
}
function chainOutline(strokes, asp) {
  /* خط‌هایی که سر به سر به هم می‌رسن رو یه مسیر واحد می‌کنه
     (شکل معمولاً با چند بار بلند کردن انگشت کشیده می‌شه) */
  const items = strokes.map((st, i) => ({ i, pts: st.points.map(p => [p[0], p[1] * asp]) }));
  items.sort((a, b) => b.pts.length - a.pts.length);
  const used = new Set([items[0].i]);
  let path = items[0].pts.slice();
  const idxs = [items[0].i];
  let grew = true;
  while (grew) {
    grew = false;
    for (const it of items) {
      if (used.has(it.i)) continue;
      const sp = it.pts, s0 = sp[0], s1 = sp[sp.length - 1];
      const p0 = path[0], p1 = path[path.length - 1];
      const cands = [
        { d: Math.hypot(p1[0] - s0[0], p1[1] - s0[1]), act: () => { path = path.concat(sp.slice(1)); } },
        { d: Math.hypot(p1[0] - s1[0], p1[1] - s1[1]), act: () => { path = path.concat(sp.slice(0, -1).reverse()); } },
        { d: Math.hypot(p0[0] - s1[0], p0[1] - s1[1]), act: () => { path = sp.concat(path.slice(1)); } },
        { d: Math.hypot(p0[0] - s0[0], p0[1] - s0[1]), act: () => { path = sp.slice().reverse().concat(path.slice(1)); } }
      ];
      cands.sort((a, b) => a.d - b.d);
      if (cands[0].d < 0.30) { cands[0].act(); used.add(it.i); idxs.push(it.i); grew = true; }
    }
  }
  return { path, idxs };
}
$('tidyBtn').onclick = () => {
  if (!cur || !cur.strokes.length) { flashMsg('اول شکل رو بکش'); return; }
  const totalPts = cur.strokes.reduce((a, s) => a + s.points.length, 0);
  if (totalPts < 8) { flashMsg('اول شکل رو بکش'); return; }
  const asp = (cv.height / cv.width) || 1;
  const chained = chainOutline(cur.strokes, asp);
  const st = cur.strokes[chained.idxs[0]];
  let P = chained.path;
  const closed = Math.hypot(P[0][0] - P[P.length - 1][0], P[0][1] - P[P.length - 1][1]) < (chained.idxs.length > 1 ? 0.30 : 0.09);
  if (closed) while (P.length > 3 && Math.hypot(P[0][0] - P[P.length - 1][0], P[0][1] - P[P.length - 1][1]) < 0.02) P.pop();
  const R = [P[0]];
  let acc = 0;
  for (let i = 1; i <= P.length; i++) {
    if (i === P.length && !closed) break;
    const a = P[i - 1], b = P[i % P.length];
    acc += Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (acc >= 0.008) { R.push(b); acc = 0; }
  }
  let V;
  if (closed) {
    while (R.length > 3 && Math.hypot(R[0][0] - R[R.length - 1][0], R[0][1] - R[R.length - 1][1]) < 0.02) R.pop();
    V = ringSimplify(R, 0.012);
  } else {
    V = dpSimplify(R, 0.012);
  }
  V = dropStraight(V, closed);
  if (V.length < (closed ? 3 : 2)) { flashMsg('شکل واضحی پیدا نشد'); return; }
  pushHistory();
  orthoSnap(V, closed, 0.5);
  let fitted = false, cmPerUnit = null;
  if (closed && cur.labels.length) {
    const n = V.length, targets = new Map();
    cur.labels.forEach(l => {
      const lp = [l.x, l.y * asp];
      let bi = -1, bd = 1e9;
      for (let e = 0; e < n; e++) {
        const a = V[e], b = V[(e + 1) % n];
        const d = Math.hypot(lp[0] - (a[0] + b[0]) / 2, lp[1] - (a[1] + b[1]) / 2);
        if (d < bd) { bd = d; bi = e; }
      }
      if (bi >= 0 && +l.value > 0) targets.set(bi, { v: +l.value, lbl: l });
    });
    if (targets.size) {
      let s = 0;
      targets.forEach((t, e) => {
        const a = V[e], b = V[(e + 1) % V.length];
        const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
        if (L > 1e-6) s = Math.max(s, t.v / L);
      });
      if (s > 0) {
        const C = V.map(p => [p[0] * s, p[1] * s]);
        for (let it = 0; it < 400; it++) {
          targets.forEach((t, e) => {
            const a = C[e], b = C[(e + 1) % C.length];
            const dx = b[0] - a[0], dy = b[1] - a[1];
            const L = Math.hypot(dx, dy); if (L < 1e-6) return;
            const err = (L - t.v) / 2, ux = dx / L, uy = dy / L;
            a[0] += ux * err; a[1] += uy * err;
            b[0] -= ux * err; b[1] -= uy * err;
          });
          if (it % 25 === 0 && it < 300) orthoSnap(C, true, 0.35);
        }
        V = C.map(p => [p[0] / s, p[1] / s]);
        cmPerUnit = s; fitted = true;
        targets.forEach((t, e) => {
          const a = V[e], b = V[(e + 1) % V.length];
          t.lbl.x = (a[0] + b[0]) / 2; t.lbl.y = ((a[1] + b[1]) / 2) / asp;
        });
      }
    }
  }
  const xs = V.map(p => p[0]), ys = V.map(p => p[1]);
  const bw = Math.max.apply(null, xs) - Math.min.apply(null, xs);
  const bh = Math.max.apply(null, ys) - Math.min.apply(null, ys);
  let k = 1;
  if (bw > 0.92) k = Math.min(k, 0.92 / bw);
  if (bh > 0.92 * asp) k = Math.min(k, (0.92 * asp) / bh);
  const cx = (Math.max.apply(null, xs) + Math.min.apply(null, xs)) / 2;
  const cy = (Math.max.apply(null, ys) + Math.min.apply(null, ys)) / 2;
  V = V.map(p => [0.5 + (p[0] - cx) * k, asp / 2 + (p[1] - cy) * k]);
  if (fitted && k !== 1) cmPerUnit = cmPerUnit / k;
  const out = V.map(p => [p[0], p[1] / asp]);
  if (closed) out.push(out[0].slice());
  const insertAt = Math.min.apply(null, chained.idxs);
  cur.strokes = cur.strokes.filter((_, i) => chained.idxs.indexOf(i) < 0);
  cur.strokes.splice(Math.min(insertAt, cur.strokes.length), 0, { color: st.color, width: st.width, points: out });
  if (fitted) cur.cmPerUnit = cmPerUnit;
  render(); saveCur(false);
  flashMsg(fitted ? 'شکل با اندازه‌ها تنظیم شد ✓' : 'شکل مرتب شد ✓');
};

/* ===== کشیدن ===== */
let drawing = null, downAt = null;
function pos(e) {
  const r = wrap.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height, cx: e.clientX - r.left, cy: e.clientY - r.top };
}

cv.addEventListener('pointerdown', e => {
  if (!cur) return;
  const p = pos(e); downAt = p;
  if (tool === 'pen') {
    preStroke = JSON.stringify({ strokes: cur.strokes, labels: cur.labels });
    drawing = { color, width: widthPt, points: [[p.x, p.y]] };
    cur.strokes.push(drawing);
    cv.setPointerCapture(e.pointerId);
    render();
  }
});
cv.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = pos(e), last = drawing.points[drawing.points.length - 1];
  if (Math.hypot(p.x - last[0], p.y - last[1]) > 0.004) { drawing.points.push([p.x, p.y]); render(); }
});
cv.addEventListener('pointerup', e => {
  const p = pos(e);
  if (drawing) {
    if (drawing.points.length < 2) { cur.strokes.pop(); preStroke = null; } else pushHistoryBefore();
    drawing = null; render(); saveCur(); return;
  }
  const wasTap = downAt && Math.hypot(p.x - downAt.x, p.y - downAt.y) < 0.02;
  if (!wasTap) return;
  if (tool === 'num') openNumSheet(p, null);
  else if (tool === 'erase') eraseAt(p);
});

/* نسخه قبل از شروع هر خط برای واگرد نگه داشته می‌شود */
let preStroke = null;
function pushHistoryBefore() { if (preStroke) { history.push(preStroke); if (history.length > 40) history.shift(); preStroke = null; } }

function eraseAt(p) {
  const li = cur.labels.findIndex(l => Math.hypot(l.x - p.x, l.y - p.y) < 0.07);
  if (li >= 0) { pushHistory(); cur.labels.splice(li, 1); render(); saveCur(); return; }
  const si = cur.strokes.findIndex(st => st.points.some(pt => Math.hypot(pt[0] - p.x, pt[1] - p.y) < 0.045));
  if (si >= 0) { pushHistory(); cur.strokes.splice(si, 1); render(); saveCur(); }
}

/* ===== برچسب عدد: لمس برای ویرایش، کشیدن برای جابه‌جایی ===== */
let dragLbl = null, dragMoved = false, dragStart = null;
wrap.addEventListener('pointerdown', e => {
  const el = e.target.closest('.lbl'); if (!el || !cur) return;
  const l = cur.labels.find(x => x.id === el.dataset.id); if (!l) return;
  dragLbl = l; dragMoved = false; dragStart = pos(e);
  el.setPointerCapture(e.pointerId);
  e.preventDefault();
});
wrap.addEventListener('pointermove', e => {
  if (!dragLbl) return;
  const p = pos(e);
  if (Math.hypot(p.x - dragStart.x, p.y - dragStart.y) > 0.015) dragMoved = true;
  if (dragMoved) { dragLbl.x = Math.min(0.98, Math.max(0.02, p.x)); dragLbl.y = Math.min(0.97, Math.max(0.03, p.y)); renderLabels(); }
});
wrap.addEventListener('pointerup', e => {
  if (!dragLbl) return;
  if (dragMoved) saveCur(); else openNumSheet(null, dragLbl);
  dragLbl = null;
});

/* ===== شیت عدد ===== */
let pendingPos = null, editingLbl = null, numCancelNext = false;
/* شیت همیشه بالای کیبورد می‌مونه: فاصله پایین = ارتفاع کیبورد از روی visualViewport */
function fitNumSheet() {
  if (!window.visualViewport) return;
  const vv = window.visualViewport;
  const off = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  $('numScrim').style.paddingBottom = off + 'px';
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', fitNumSheet);
  visualViewport.addEventListener('scroll', fitNumSheet);
}
function openNumSheet(p, lbl) {
  pendingPos = p; editingLbl = lbl; numCancelNext = false;
  $('numTitle').textContent = lbl ? 'ویرایش اندازه (سانتیمتر)' : 'اندازه به سانتیمتر';
  $('numInp').value = lbl ? lbl.value : '';
  $('numDel').style.display = lbl ? 'block' : 'none';
  $('numScrim').classList.add('open');
  fitNumSheet();
  // فوکوس هم‌گام با لمس کاربر تا کیبورد آیفون خودکار بالا بیاد
  try { $('numInp').focus({ preventScroll: true }); } catch (e) { $('numInp').focus(); }
  setTimeout(() => { if (document.activeElement !== $('numInp')) $('numInp').focus(); fitNumSheet(); }, 80);
  setTimeout(fitNumSheet, 350);
}
function closeNumSheet() {
  $('numInp').blur();
  $('numScrim').classList.remove('open');
  $('numScrim').style.paddingBottom = '0px';
  window.scrollTo(0, 0);
}
function submitNum() {
  if (!$('numScrim').classList.contains('open')) return;
  const v = parseNum($('numInp').value);
  if (isNaN(v) || v <= 0) { closeNumSheet(); return; }
  pushHistory();
  if (editingLbl) editingLbl.value = v;
  else cur.labels.push({ id: uid(), x: pendingPos.x, y: pendingPos.y, value: v });
  closeNumSheet(); render(); saveCur();
}
$('numOk').onclick = submitNum;
$('numInp').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); submitNum(); }
});
/* تیک ✓ کیبورد = بستن کیبورد = خروج فوکوس از اینپوت → خودش ثبت می‌شه
   (مگر این که کاربر لغو/حذف/بیرون شیت رو زده باشه) */
$('numInp').addEventListener('blur', () => {
  if ($('numScrim').classList.contains('open') && !numCancelNext) submitNum();
  numCancelNext = false;
});
$('numCancel').addEventListener('pointerdown', () => { numCancelNext = true; });
$('numCancel').onclick = closeNumSheet;
$('numDel').addEventListener('pointerdown', () => { numCancelNext = true; });
$('numScrim').addEventListener('pointerdown', e => { if (e.target === $('numScrim')) numCancelNext = true; });
$('numScrim').addEventListener('click', e => { if (e.target === $('numScrim')) closeNumSheet(); });
$('numDel').onclick = () => {
  if (!editingLbl) return;
  pushHistory();
  cur.labels = cur.labels.filter(l => l.id !== editingLbl.id);
  closeNumSheet(); render(); saveCur();
};

/* ===== دکمه بروزرسانی: گرفتن نسخه تازه به‌زور ===== */
$('updBtn').onclick = async () => {
  const btn = $('updBtn');
  btn.disabled = true; btn.textContent = 'در حال دریافت…';
  try {
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) await reg.update();
    }
  } catch (e) {}
  location.replace(location.pathname + '?u=' + Date.now());
};

/* ===== شروع ===== */
renderList();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
